# Opt-in example: authorized SMB/NTLM assessment workflow.
#
# This preset is NOT discoverable until the authorized-operations pack is
# explicitly registered AND the engagement scope allows the declared effects.
# Every action still requires an explicit authorization reference at run time.
# No tool is installed or executed by loading this document.

api_version: ambrosia/v1
kind: preset
metadata:
  id: authorized.smb-assessment
  name: Authorized SMB Assessment
  version: 1.0.0
  description: >
    Opt-in high-impact SMB/NTLM workflow for an explicitly authorized engagement.
    Requires the authorized-operations pack, an expanded scope, an authorization
    reference, and approval.
  tags: [authorized, windows, smb, ntlm]

inputs:
  target:
    type: target.host
    required: true
    source: user
  authorization_reference:
    type: string
    required: true
    source: user
  username:
    type: string
    required: false
    source: user
  password:
    type: string
    required: false
    source: secrets

steps:
  - id: netexec_smb
    type: action
    action: windows.smb.netexec
    inputs:
      target: "{{ inputs.target }}"
      authorization_reference: "{{ inputs.authorization_reference }}"
      username: "{{ inputs.username }}"
      password: "{{ inputs.password }}"
      protocol: smb
    on_failure: stop

  - id: ad_users
    type: action
    action: windows.ad.domain_enumeration
    inputs:
      target: "{{ inputs.target }}"
      authorization_reference: "{{ inputs.authorization_reference }}"
      username: "{{ inputs.username }}"
      password: "{{ inputs.password }}"
    needs: [netexec_smb]
    on_failure: continue

outputs: {}
