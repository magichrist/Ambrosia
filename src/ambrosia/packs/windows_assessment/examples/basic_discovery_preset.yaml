# Example ambrosia/v1 preset: bounded read-only Windows service discovery.
#
# This preset runs Nmap service discovery on an explicitly in-scope target and
# publishes the follow-up action each discovered service makes relevant. It is a
# runnable demonstration of the artifact -> context -> action suggestion chain.
#
# Suggestion chain implemented by action required_artifacts (same_target).
# Follow-up requirements accept BOTH the canonical label and the real Nmap
# service name, so these predicates use the names Nmap actually emits:
#
#   service_name microsoft-ds  -> windows.smb.configuration_audit
#   service_name ldap          -> windows.ldap.domain_inventory
#   service_name http|https    -> windows.http.method_observation
#   service_name ms-wbt-server -> windows.rdp.exposure_observation
#   service_name wsman         -> windows.winrm.exposure_observation
#
# The SMB audit can additionally emit windows.domain / windows.host_role
# artifacts that unlock domain-level actions in future packs.

api_version: ambrosia/v1
kind: preset
metadata:
  id: windows.basic-discovery
  name: Windows Basic Discovery
  version: 1.0.0
  description: >
    Bounded read-only service discovery on an in-scope Windows target.
    Discovers SMB, LDAP, HTTP, RDP, and WinRM services and emits typed
    artifacts that surface follow-up configuration-assessment actions.
  tags: [discovery, windows, read-only]
  author: ambrosia

phase_refs:
  - windows.discovery

inputs:
  target:
    type: target.host
    required: true
    source: context_or_user
  ports:
    type: string
    required: false
    default: "80,443,445,3389,5985"

steps:
  - id: discover
    type: action
    action: network.nmap.service_discovery
    inputs:
      target: "{{ inputs.target }}"
      ports: "{{ inputs.ports }}"
    outputs:
      services: { source: "{{ steps.discover.outputs.services }}" }
    on_failure: stop

  # Each condition below publishes the follow-up action made relevant by a
  # discovered service. No process is started by a condition or output step.
  - id: suggest_smb
    type: condition
    when:
      kind: artifact_field_equals
      artifact_type: network.service
      field: service_name
      value: microsoft-ds
    then: [publish_smb]
  - id: publish_smb
    type: output
    outputs:
      next_actions: { source: "{{ steps.suggest_smb.outputs.result }}" }

  - id: suggest_ldap
    type: condition
    when:
      kind: artifact_field_equals
      artifact_type: network.service
      field: service_name
      value: ldap
    then: [publish_ldap]
  - id: publish_ldap
    type: output
    outputs:
      next_actions: { source: "{{ steps.suggest_ldap.outputs.result }}" }

  - id: suggest_http
    type: condition
    when:
      kind: artifact_field_equals
      artifact_type: network.service
      field: service_name
      value: http
    then: [publish_http]
  - id: publish_http
    type: output
    outputs:
      next_actions: { source: "{{ steps.suggest_http.outputs.result }}" }

  - id: suggest_rdp
    type: condition
    when:
      kind: artifact_field_equals
      artifact_type: network.service
      field: service_name
      value: ms-wbt-server
    then: [publish_rdp]
  - id: publish_rdp
    type: output
    outputs:
      next_actions: { source: "{{ steps.suggest_rdp.outputs.result }}" }

  - id: suggest_winrm
    type: condition
    when:
      kind: artifact_field_equals
      artifact_type: network.service
      field: service_name
      value: wsman
    then: [publish_winrm]
  - id: publish_winrm
    type: output
    outputs:
      next_actions: { source: "{{ steps.suggest_winrm.outputs.result }}" }

outputs:
  services: { source: "{{ steps.discover.outputs.services }}" }
