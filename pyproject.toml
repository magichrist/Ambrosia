[project]
name = "ambrosia"
version = "0.2.0"
description = "Fast TUI-first command launcher and executor workbench for authorized use"
requires-python = ">=3.12"
authors = [{ name = "Ambrosia" }]
dependencies = [
    "textual>=0.86,<1",
    "typer[all]>=0.12,<1",
    "pyyaml>=6,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<1",
    "hypothesis>=6.100,<7",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "build>=1.2,<2",
    "types-PyYAML>=6,<7",
]

[project.scripts]
ambrosia = "ambrosia.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ambrosia*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# Planning docs contain illustrative Python snippets, not production code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "B", "C4", "UP", "PTH", "TCH", "TID", "FLY", "ANN", "ARG", "RET", "TRY"]
ignore = ["E501", "B008", "ANN401", "ARG001", "ARG002", "ARG003", "RET504", "TRY300", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain asserts, fixtures may use fake secrets/temp paths, and
# test helpers don't need the production-level typing/lint strictness.
"tests/**" = [
    "S101",    # use of assert
    "S105",    # hardcoded password string (fake credentials in fixtures)
    "S106",    # hardcoded password function arg
    "S108",    # hardcoded temp file (test fixtures)
    "S604",    # false positive on the `Command.shell` dataclass field; tests mock subprocess, never shell=True
    "ANN001",  # missing type annotation for function argument
    "ANN002",  # missing type annotation for *args
    "ANN003",  # missing type annotation for **kwargs
    "ANN201",  # missing return type annotation for public function
    "ANN202",  # missing return type annotation for private function
    "ANN205",  # missing return type annotation for static method
    "ARG004",  # unused static method argument (fake signatures)
    "B017",    # assertRaises(Exception)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "contract: contract tests",
    "integration: integration tests",
    "tui: TUI tests",
]
