[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by the AMBROSIA_DB_URL environment variable)
sqlalchemy.url = sqlite:///ambrosia.db

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local timezone
# timezone =

# max length of characters to apply to the
# "version code" column
# max_version_code_length = 32

# template used to generate migration files
# The default uses ${file} for the migration file name and ${message} for
# the user-supplied message.  A custom template can override this.
# The default template is:
#     %(rev)s_%(message)s

# version code separator; default: "_"
# version_code_separator = _

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated migration scripts.  See the documentation for further detail and
# examples
# format = "%(type)s: %(name)s %(path)s"

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
