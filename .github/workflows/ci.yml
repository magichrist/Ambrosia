name: CI

# Leave the PR gate fast and deterministic. The wider OS/Python matrix and
# optional live-tool integration tests belong in a nightly workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # 1. Ruff lint
      - name: Ruff lint
        run: ruff check .

      # 2. Ruff format check
      - name: Ruff format check
        run: ruff format --check .

      # 3. Static type check
      - name: Static type check (mypy)
        run: mypy src

      # 4. Unit tests
      - name: Unit tests
        run: pytest tests/unit -q

      # 5. Contract tests
      - name: Contract tests
        run: pytest tests/contract -q

      # 6. TUI smoke tests
      - name: TUI smoke tests
        run: pytest tests/tui -q

      # 7. Dependency audit (informational until the baseline is triaged)
      - name: Dependency audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit --disable-pip

      # 8. Build wheel and sdist
      - name: Build wheel and sdist
        run: python -m build

      # 9. CLI help smoke test from the installed package
      - name: CLI help smoke test
        run: |
          ambrosia --help
          python -m ambrosia --help
