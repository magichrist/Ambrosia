# Phase detection metadata — NOT a permission or lifecycle gate.
id: windows.credentials
name: "Credential access"
description: >
  Authorized credential and Kerberos assessment. Every action in this phase is
  high-impact and requires explicit authorization, scope effect allowlisting,
  and approval.
tags: [windows, credentials, authorized]
sort_order: 40
action_refs:
  - windows.credentials.secretsdump
  - windows.ad.asrep_roast
  - windows.ad.kerberoast
  - windows.kerberos.tgt_request
preset_refs:
  - windows.authorized.credentials
  - authorized.comprehensive-windows
visible_when:
  - kind: artifact_exists
    artifact_type: network.service
complete_when:
  - kind: artifact_exists
    artifact_type: secret.ref
  - kind: artifact_exists
    artifact_type: windows.assessment_step
    where: {phase: windows.credentials}
