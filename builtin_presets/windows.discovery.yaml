# Default (read-only) Windows discovery workflow.
# Recommended by the windows.recon phase. Runs bounded Nmap service discovery
# followed by read-only configuration observations. No credentials, no changes.
api_version: ambrosia/v1
kind: preset
metadata:
  id: windows.builtin.discovery
  name: Windows Discovery (read-only)
  version: 1.0.0
  description: >
    Profile the selected target: bounded service discovery, then read-only
    SMB/LDAP/HTTP/RDP/WinRM exposure observations. Produces the artifacts that
    let the workspace detect the next phase.
  tags: [windows, discovery, read-only, builtin]
  author: ambrosia

inputs:
  target:
    type: target.host
    required: true
    source: context_or_user

steps:
  - id: services
    type: action
    action: network.nmap.service_discovery
    inputs:
      target: "{{ inputs.target }}"
    on_failure: stop

  - id: smb
    type: action
    action: windows.smb.configuration_audit
    inputs:
      target: "{{ inputs.target }}"
    needs: [services]
    on_failure: continue

  - id: ldap
    type: action
    action: windows.ldap.domain_inventory
    inputs:
      target: "{{ inputs.target }}"
    needs: [services]
    on_failure: continue

  - id: rdp
    type: action
    action: windows.rdp.exposure_observation
    inputs:
      target: "{{ inputs.target }}"
    needs: [services]
    on_failure: continue

  - id: winrm
    type: action
    action: windows.winrm.exposure_observation
    inputs:
      target: "{{ inputs.target }}"
    needs: [services]
    on_failure: continue

  - id: http
    type: action
    action: windows.http.method_observation
    inputs:
      target: "{{ inputs.target }}"
    needs: [services]
    on_failure: continue

outputs: {}
